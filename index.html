<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Sane, Founder? An unofficial GGG simulator</title>
<meta name="description" content="A fan-made parody management game about twenty years of running an action RPG studio. Not affiliated with Grinding Gear Games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23070504'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23c9aa71' stroke-width='5' stroke-dasharray='3.9 3.95'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='%23c9aa71'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23070504'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&display=swap">
</head>
<body>

<div id="app">
  <header id="top"></header>
  <main id="main">
    <section id="stage">
      <div id="stage-bg"><i></i><i></i></div>
      <canvas id="embers" aria-hidden="true"></canvas>
      <canvas id="chart" aria-hidden="true"></canvas>
      <div id="rel"></div>
      <div id="card" aria-live="polite"></div>
      <div id="drops" aria-live="polite"></div>
      <div id="flash"></div>
    </section>
    <aside id="side">
      <h2>r/pathofexile</h2>
      <div id="reqs"></div>
      <div id="feed"></div>
      <form id="chat" autocomplete="off">
        <input id="chat-in" maxlength="60" placeholder="/" aria-label="Global chat">
      </form>
    </aside>
  </main>
  <footer id="hud"></footer>
</div>

<div id="title"></div>
<div id="modal-root" role="dialog" aria-modal="true"></div>
<div id="tip"></div>

<script src="js/util.js"></script>
<script src="js/data/tune.js"></script>
<script src="js/data/cycles.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/randoms.js"></script>
<script src="js/data/requests.js"></script>
<script src="js/data/feed.js"></script>
<script src="js/data/eggs.js"></script>
<script src="art/manifest.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
